name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/vmlite-linux-amd64 .
          (cd dist && sha256sum vmlite-linux-amd64 > vmlite-linux-amd64.sha256)

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/vmlite-linux-amd64 \
            dist/vmlite-linux-amd64.sha256 \
            --title "$GITHUB_REF_NAME" \
            --notes "vmlite $GITHUB_REF_NAME"
