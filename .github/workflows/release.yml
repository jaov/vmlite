name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/vmlite-linux-amd64 .

      - name: install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: package
        env:
          VMLITE_VERSION: ${{ github.ref_name }}
        run: |
          version="${VMLITE_VERSION#v}"
          VMLITE_VERSION="$version" nfpm package \
            --config packaging/nfpm.yaml \
            --packager deb \
            --target dist/
          VMLITE_VERSION="$version" nfpm package \
            --config packaging/nfpm.yaml \
            --packager rpm \
            --target dist/
          dpkg-deb --info dist/vmlite_*.deb
          dpkg-deb --contents dist/vmlite_*.deb

      - name: checksums
        run: |
          cd dist
          sha256sum vmlite-linux-amd64 vmlite_*.deb vmlite-*.rpm > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "vmlite $GITHUB_REF_NAME"
