name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: build
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=ci" -o dist/vmlite-linux-amd64 .

      - uses: actions/upload-artifact@v4
        with:
          name: vmlite-linux-amd64
          path: dist/vmlite-linux-amd64
